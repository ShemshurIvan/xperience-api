spring.h2.console.enabled=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.application.name=xperience
spring.main.banner-mode=off
spring.jpa.open-in-view=false
logging.level.root=warn

# Local runs read secrets from the .env file in the project folder (ignored by git).
# In Docker, the values come from environment variables instead.
spring.config.import=optional:file:.env[.properties]

# JWT: the secret signs the tokens, so it must never be committed.
# It must be at least 32 characters long (HS256).
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# The account with this email becomes ADMIN (at registration, or at startup if it already exists).
# Empty = no admin.
app.admin-email=${ADMIN_EMAIL:}

